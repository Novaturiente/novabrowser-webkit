<!doctype html>
<title>colour roles</title>
<style>
  body { font: 16px sans-serif; margin: 24px; }
  .row { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 16px; }
  .box { width: 150px; padding: 12px; border: 2px solid #ccc; box-shadow: 0 2px 8px rgba(0,0,0,.25); }
  header { background: #24292f; color: #fff; padding: 12px; }
  code { background: #f6f8fa; border: 1px solid #d0d7de; padding: 2px 4px; }
  .grad { height: 40px; background: linear-gradient(90deg, #fff, #0969da); }
  a { color: #0969da; }
</style>
<header>Dark header with white text (stays dark)</header>
<h1>Heading in default black</h1>
<p>Body text in default black, a <a href="#">blue link</a>, <code>inline code</code>, and
<span style="color:#cf222e">red text</span> / <span style="color:#1a7f37">green text</span>.</p>
<div class="row">
  <div class="box" style="background:#fff">white #fff</div>
  <div class="box" style="background:#fff3cd">yellow note #fff3cd</div>
  <div class="box" style="background:#d4edda">green ok #d4edda</div>
  <div class="box" style="background:#f8d7da">red alert #f8d7da</div>
  <div class="box" style="background:#cfe2ff">blue info #cfe2ff</div>
  <div class="box" style="background:#0969da;color:#fff">blue button</div>
  <div class="box" style="background:#ffd700">gold #ffd700</div>
</div>
<div class="grad"></div>
<p><svg width="40" height="40"><circle cx="20" cy="20" r="16" fill="#222"/></svg> SVG icon (dark fill)
<input value="text field"> <button>Button</button> <input type="checkbox" checked></p>
