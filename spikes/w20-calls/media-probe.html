<!doctype html>
<meta charset="utf-8">
<title>probe: running</title>
<pre id="out"></pre>
<script>
// W20 spike: what a call page sees. Result lands in document.title (read over IPC).
const r = {};
const out = (k, v) => { r[k] = v; document.getElementById('out').textContent = JSON.stringify(r, null, 1); document.title = 'probe: ' + JSON.stringify(r); };
(async () => {
  out('secure', isSecureContext);
  out('crossOriginIsolated', self.crossOriginIsolated);
  out('SharedArrayBuffer', typeof SharedArrayBuffer);
  out('RTCPeerConnection', typeof RTCPeerConnection);
  out('VideoEncoder', typeof VideoEncoder);
  out('AudioWorklet', typeof AudioWorkletNode);
  out('getDisplayMedia', typeof navigator.mediaDevices?.getDisplayMedia);
  out('hasFocus', document.hasFocus());
  try {
    const before = await navigator.mediaDevices.enumerateDevices();
    out('devicesBefore', before.map(d => d.kind + ':' + (d.label ? 'L' : '-')).join(','));
  } catch (e) { out('devicesBefore', 'ERR ' + e.name); }
  for (const c of [{ audio: true }, { video: true }]) {
    const k = Object.keys(c)[0];
    try {
      const s = await navigator.mediaDevices.getUserMedia(c);
      out('gum_' + k, 'ok ' + s.getTracks().map(t => t.kind + '/' + t.readyState + '/' + t.label).join(','));
      s.getTracks().forEach(t => t.stop());
    } catch (e) { out('gum_' + k, 'ERR ' + e.name + ': ' + e.message); }
  }
  try {
    const after = await navigator.mediaDevices.enumerateDevices();
    out('devicesAfter', after.map(d => d.kind + ':' + (d.label ? 'L' : '-')).join(','));
  } catch (e) { out('devicesAfter', 'ERR ' + e.name); }
  try {
    const a = new RTCPeerConnection(), b = new RTCPeerConnection();
    a.onicecandidate = e => e.candidate && b.addIceCandidate(e.candidate);
    b.onicecandidate = e => e.candidate && a.addIceCandidate(e.candidate);
    a.createDataChannel('x');
    await a.setLocalDescription(await a.createOffer());
    await b.setRemoteDescription(a.localDescription);
    await b.setLocalDescription(await b.createAnswer());
    await a.setRemoteDescription(b.localDescription);
    await new Promise(res => setTimeout(res, 3000));
    out('pc', a.connectionState + '/' + a.iceConnectionState);
  } catch (e) { out('pc', 'ERR ' + e.name + ': ' + e.message); }
  document.title = 'probe: ' + JSON.stringify(r);
})();
</script>
