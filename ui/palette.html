<!doctype html>
<meta charset="utf-8">
<title>palette</title>
<style>
  /* Floating command line + completion (Zen-style). Colours/fonts are CSS variables
     from config (theme.rs), set by nova.theme. The view is transparent: the blurred
     page behind is a GTK widget (window.rs backdrop), faded in with this view (anim.rs). */
  html, body { margin: 0; height: 100%; overflow: hidden; }
  body { background: transparent; font: var(--fonts-completion-entry, 10pt monospace);
         color: var(--colors-completion-fg, #fff); }
  #card.in { animation: pop 160ms cubic-bezier(.2, .8, .2, 1); }
  @keyframes pop { from { transform: translateY(-10px) scale(.98); } }
  @media (prefers-reduced-motion: reduce) { #card.in { animation: none; } }
  /* Floating pieces over the blurred page: the input is a pill, each completion
     category its own card below it; one list for the keys (the core moves `sel`). */
  #card { position: relative; margin: 10vh auto 0; width: min(760px, 86vw); box-sizing: border-box;
          display: flex; flex-direction: column; gap: 10px; }
  #bar { display: flex; align-items: center; gap: 12px; padding: 0 20px; height: 52px; border-radius: 999px;
         background: var(--colors-completion-even-bg, #222);
         border: 1px solid var(--colors-completion-category-border-top, #444);
         box-shadow: 0 14px 40px rgba(0, 0, 0, .5); }
  #bar:focus-within { border-color: color-mix(in srgb, var(--colors-completion-category-fg, #48f) 55%, transparent); }
  #icon { flex: 0 0 auto; width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center;
          font-weight: bold; color: var(--colors-completion-category-fg, #48f);
          background: color-mix(in srgb, var(--colors-completion-category-fg, #48f) 18%, transparent); }
  /* search (/, ?): the view is a small strip at the bottom centre (window.rs): just the pill */
  body.compact #card { margin: 0; width: 100%; height: 100%; padding: 6px; box-sizing: border-box; }
  body.compact #bar { height: 100%; box-shadow: 0 2px 6px rgba(0, 0, 0, .35); }
  body.compact #list { display: none; }
  #count { flex: 0 0 auto; opacity: .6; font-variant-numeric: tabular-nums; }
  #count:empty { display: none; }
  #cmd::placeholder { color: inherit; opacity: .45; }
  #cmd { flex: 1; min-width: 0; box-sizing: border-box; padding: 0; border: 0; outline: 0;
         background: transparent; color: var(--colors-statusbar-command-fg, inherit);
         font: var(--fonts-statusbar, 11pt monospace); font-size: 1.15em; }
  /* the cards share the height; a big one scrolls inside itself, so every card keeps its
     rounded border (the list cut the last card off square) */
  #list { position: relative; max-height: var(--palette-list-height, 40vh); overflow: hidden;
          display: flex; flex-direction: column; gap: 10px;
          /* room for the cards' shadows inside the scroll box, which clips them */
          padding: 0 18px 24px; margin: 0 -18px; }
  #list:empty { display: none; }
  body.tall #list { max-height: 70vh; }
  .grp { position: relative; flex: 0 1 auto; min-height: 0; overflow-y: auto; scrollbar-width: none;
         padding: 0 6px 6px; border-radius: 18px; scroll-padding: 36px 0 8px;
         background: var(--colors-completion-even-bg, #222);
         border: 1px solid var(--colors-completion-category-border-top, #444);
         box-shadow: 0 6px 16px rgba(0, 0, 0, .35); }
  .grp.small { flex-shrink: 0; }
  .cat { position: sticky; top: 0; z-index: 3; display: flex; gap: 8px; padding: 10px 10px 4px;
         background: var(--colors-completion-even-bg, #222); font: var(--fonts-completion-category, bold 10pt monospace);
         color: var(--colors-completion-category-fg); }
  .cat small { font: inherit; font-weight: normal; opacity: .6; }
  /* the selection highlight slides between rows (positioned in the selected row's card) */
  #hl { position: absolute; left: 0; top: 0; z-index: 1; border-radius: 10px; pointer-events: none;
        background: var(--colors-completion-item-selected-bg);
        box-shadow: inset 3px 0 0 var(--colors-completion-category-fg, #48f);
        transition: transform 140ms cubic-bezier(.2, .8, .2, 1), width 140ms, height 140ms; }
  #hl.jump { transition: none; }
  @media (prefers-reduced-motion: reduce) { #hl { transition: none; } }
  .row { position: relative; z-index: 2; display: flex; align-items: center; gap: 10px; padding: 6px 12px;
         white-space: nowrap; border-radius: 10px; }
  .row.sel { color: var(--colors-completion-item-selected-fg); }
  .row img, .row .fi { flex: 0 0 16px; width: 16px; height: 16px; border-radius: 4px; }
  .row .fi { background: color-mix(in srgb, currentColor 15%, transparent); }
  .a { flex: 0 1 60%; overflow: hidden; text-overflow: ellipsis; }
  .b { flex: 1; overflow: hidden; text-overflow: ellipsis; opacity: .65; }
</style>
<body>
<div id="card"><div id="bar"><span id="icon"></span><input id="cmd" spellcheck="false"><span id="count"></span></div><div id="list"></div></div>
<script>
  const $ = (id) => document.getElementById(id);
  nova.theme = (t) => {
    for (const [k, v] of Object.entries(t.vars)) document.documentElement.style.setProperty(k, v);
    document.documentElement.style.setProperty("--palette-list-height", t.listHeight);
  };
  // Completion: nova.complete({title, items: [[text, description]], sel}) or null.
  const list = $("list");
  // cats (optional): category per item; a header row goes where it changes.
  // One card per category (cats[i]; none = one card titled s.title). Rows with a web
  // address get the site icon from nova.icons (window.rs, WebKit's icon store).
  const icons = new Map();
  const urlOf = (a, b) => [a, b].find((x) => /^https?:\/\//.test(x || "")) || "";
  const hl = document.createElement("div");
  hl.id = "hl";
  let lastItems = null;
  nova.complete = (s) => {
    const items = s ? s.items : [];
    const cats = (s && s.cats) || [];
    // same list, only `sel` moved: slide the highlight, don't rebuild
    if (s && lastItems === JSON.stringify([items, cats])) return select(s.sel, true);
    lastItems = s ? JSON.stringify([items, cats]) : null;
    const count = {};
    cats.forEach((c) => { count[c] = (count[c] || 0) + 1; });
    const groups = [];
    let grp = null;
    items.forEach(([a, b], i) => {
      const cat = cats[i] || (s && s.title) || "";
      if (!grp || cat !== (cats[i - 1] || (s && s.title) || "")) {
        grp = document.createElement("div");
        grp.className = "grp";
        if (cat) {
          const h = document.createElement("div");
          h.className = "cat";
          h.append(cat);
          if (count[cat]) h.append(Object.assign(document.createElement("small"), { textContent: count[cat] }));
          grp.append(h);
        }
        groups.push(grp);
      }
      const row = document.createElement("div");
      row.className = "row";
      const u = urlOf(a, b);
      if (u) {
        row.dataset.u = u;
        row.append(icons.get(u) ? Object.assign(document.createElement("img"), { src: icons.get(u) }) : Object.assign(document.createElement("span"), { className: "fi" }));
      }
      for (const [cls, text] of [["a", a], ["b", b]]) {
        const d = document.createElement("div");
        d.className = cls;
        d.textContent = text;
        row.append(d);
      }
      grp.append(row);
    });
    // short cards keep their size; the long ones shrink and scroll
    for (const g of groups) g.classList.toggle("small", g.querySelectorAll(".row").length <= 4);
    list.replaceChildren(...groups);
    if (s) select(s.sel, false);
  };
  const select = (sel, slide) => {
    const rows = list.querySelectorAll(".row");
    rows.forEach((r, i) => r.classList.toggle("sel", i === sel));
    const r = rows[sel];
    hl.style.display = r ? "" : "none";
    if (!r) return;
    const g = r.parentElement;
    // into another card: no slide (the cards scroll on their own)
    if (hl.parentElement !== g) { g.append(hl); slide = false; }
    r.scrollIntoView({ block: "nearest" });
    const lr = g.getBoundingClientRect(), rr = r.getBoundingClientRect();
    hl.classList.toggle("jump", !slide);
    hl.style.width = rr.width + "px";
    hl.style.height = rr.height + "px";
    hl.style.transform = `translate(${rr.left - lr.left - g.clientLeft}px, ${rr.top - lr.top - g.clientTop + g.scrollTop}px)`;
  };
  // nova.icons({url: data-url}): fill in site icons as WebKit's icon store answers
  nova.icons = (m) => {
    for (const [u, src] of Object.entries(m)) {
      icons.set(u, src);
      for (const r of list.querySelectorAll(".row")) {
        if (r.dataset.u === u && r.querySelector(".fi")) r.querySelector(".fi").replaceWith(Object.assign(document.createElement("img"), { src }));
      }
    }
  };
  // cmd-set-text: show the input with text, cursor at the end. compact = search (no backdrop).
  // `:open [-t|-b|-w] ` is kept out of sight (o/O just ask for an address, like Zen);
  // the core always gets and sends the full command line.
  let pre = "";
  const OPEN = /^:(?:open(?: -[tbw])*|bindings|profile-new) /;
  const full = () => pre + c.value;
  const show = (text) => {
    const m = text.match(OPEN);
    pre = m ? m[0] : "";
    c.value = text.slice(pre.length);
    document.body.classList.toggle("tall", pre === ":bindings ");
    c.placeholder = !pre ? "" : pre === ":bindings " ? "Filter key bindings…  (Esc closes)" : pre === ":profile-new " ? "Name for the new profile…" : / -[tw]/.test(pre) ? "Open in new tab…" : / -b/.test(pre) ? "Open in background tab…" : "Search or enter address…";
    c.setSelectionRange(c.value.length, c.value.length);
    const search = document.body.classList.contains("compact");
    $("icon").textContent = search || pre.startsWith(":open") ? "🔍" : pre ? "›" : ":";
    if (search && !c.value.slice(1)) $("count").textContent = "";
  };
  // search position "3 / 12" while typing a search (window.rs message, level find)
  nova.count = (t) => { $("count").textContent = t; };
  nova.cmdline = (text, compact) => {
    document.body.className = compact ? "compact" : "";
    $("count").textContent = "";
    // replay the card's pop-in (the view is shown fresh each time, anim.rs)
    const card = $("card");
    card.classList.remove("in");
    void card.offsetWidth;
    if (!compact) card.classList.add("in");
    nova.complete(null);
    c.focus();
    show(text);
    nova.send("text " + text);
  };
  // Completion / history: replace the text, keep the cursor at the end, don't report it as typed.
  nova.setText = (text) => show(text);

  const c = $("cmd");
  // Deleting the leading ":" leaves command mode (qutebrowser); an emptied address stays open.
  c.addEventListener("input", () => nova.send(c.value === "" && !pre ? "cmdleave" : "text " + full()));
  let killed = "";
  // Readline edits (qutebrowser command-mode defaults). Word = run of non-space.
  // Kills stop at the leading ":".
  const edit = (from, to, newCursor, kill) => {
    const lo = !pre && c.value.startsWith(":") ? 1 : 0;
    from = Math.max(from, lo);
    newCursor = Math.max(newCursor, lo);
    if (from >= to) return;
    if (kill) killed = c.value.slice(from, to);
    c.setRangeText("", from, to);
    c.setSelectionRange(newCursor, newCursor);
    nova.send("text " + full());
  };
  const wordBack = (p) => { while (p > 0 && c.value[p - 1] === " ") p--; while (p > 0 && c.value[p - 1] !== " ") p--; return p; };
  const wordFwd = (p) => { const n = c.value.length; while (p < n && c.value[p] === " ") p++; while (p < n && c.value[p] !== " ") p++; return p; };
  const move = (p) => c.setSelectionRange(p, p);
  c.addEventListener("keydown", (e) => {
    const p = c.selectionStart, k = e.key, ctrl = e.ctrlKey && !e.altKey, alt = e.altKey && !e.ctrlKey;
    const act = (
      k === "Enter" ? () => (pre === ":bindings " || (pre && !c.value.trim()) ? nova.send("cmdleave") : nova.send("run " + full())) :
      k === "Escape" || (ctrl && k === "[") ? () => nova.send("cmdleave") :
      k === "Backspace" && !ctrl && !alt && c.value === "" ? () => nova.send("cmdleave") :
      k === "Tab" && !ctrl && !alt ? () => nova.send(e.shiftKey ? "complete -1" : "complete 1") :
      // arrows move in the list when one is shown, else browse command history (Ctrl-p/n always do)
      (k === "ArrowUp" || k === "ArrowDown") && !ctrl && !alt && list.firstChild ? () => nova.send(k === "ArrowUp" ? "complete -1" : "complete 1") :
      k === "ArrowUp" || (ctrl && k === "p") ? () => nova.send("hist -1") :
      k === "ArrowDown" || (ctrl && k === "n") ? () => nova.send("hist 1") :
      ctrl && k === "a" ? () => move(!pre && c.value.startsWith(":") ? 1 : 0) :
      ctrl && k === "e" ? () => move(c.value.length) :
      ctrl && k === "b" ? () => move(Math.max(0, p - 1)) :
      ctrl && k === "f" ? () => move(p + 1) :
      alt && k === "b" ? () => move(wordBack(p)) :
      alt && k === "f" ? () => move(wordFwd(p)) :
      ctrl && k === "u" ? () => edit(0, p, 0, true) :
      ctrl && k === "k" ? () => edit(p, c.value.length, p, true) :
      ctrl && k === "w" ? () => edit(wordBack(p), p, wordBack(p), true) :
      alt && k === "d" ? () => edit(p, wordFwd(p), p, true) :
      ctrl && k === "h" ? () => p > 0 && edit(p - 1, p, p - 1, false) :
      ctrl && k === "y" ? () => { c.setRangeText(killed, p, p, "end"); nova.send("text " + full()); } :
      null);
    if (act) { e.preventDefault(); act(); }
  });
  // Clicking the blurred page closes the palette.
  document.body.addEventListener("mousedown", (e) => { if (!$("card").contains(e.target)) nova.send("cmdleave"); });
  nova.send("ready");
</script>
</body>
