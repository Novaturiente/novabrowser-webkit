<!doctype html>
<meta charset="utf-8">
<title>tabbar</title>
<style>
  /* Colours/fonts/sizes are CSS variables from config (theme.rs), set by nova.theme. */
  html, body { margin: 0; height: 100%; }
  body { display: flex; overflow: hidden; background: var(--colors-tabs-bar-bg, #555);
         user-select: none; cursor: default; }
  body.vertical { flex-direction: column; overflow-y: auto; }
  /* Pill tabs (Chrome/Firefox style): rounded, spaced, the bar shows between them.
     window.rs adds 8 px to the bar height for the 4 px margin above and below. */
  .t { flex: 1 1 0; min-width: 0; max-width: var(--tabs-max-width, none); box-sizing: border-box;
       display: flex; align-items: center; border-radius: 999px;
       padding: var(--tabs-padding, 0 5px); padding-left: 10px; padding-right: 10px; white-space: nowrap; overflow: hidden;
       font: var(--fonts-tabs-unselected, 10pt monospace);
       color: var(--colors-tabs-odd-fg); background: var(--colors-tabs-odd-bg);
       transition: background 120ms, flex-grow 180ms ease, padding 180ms ease, width 180ms ease, opacity 180ms ease; }
  /* opening grows in, closing shrinks out (the element stays until it has, .out) */
  .t.new { animation: tin 180ms ease-out; }
  @keyframes tin { from { flex-grow: 0; opacity: 0; transform: scale(.85); } }
  .t.out { flex-grow: 0 !important; padding: 0 !important; min-width: 0 !important; opacity: 0; pointer-events: none; }
  body:not(.vertical) .t.n.out { width: 0 !important; }
  @media (prefers-reduced-motion: reduce) { .t { transition: background 120ms; } .t.new { animation: none; } }
  /* loading: a spinner in the icon's place */
  .sp { flex: 0 0 auto; width: .95em; height: .95em; margin-right: .5em; border-radius: 50%; box-sizing: border-box;
        border: 2px solid color-mix(in srgb, var(--colors-tabs-indicator-start) 25%, transparent);
        border-top-color: var(--colors-tabs-indicator-start); animation: spin .8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  body:not(.vertical) .t.n:not(.a) .sp { margin-right: 0; }
  body:not(.vertical) .t.n:not(.a) .sp + span { display: none; }
  .t span { flex: 1 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis;
            text-align: var(--tabs-title-alignment, left); }
  body:not(.vertical) .t { min-width: min(var(--tabs-min-width, 0px), 100%); }
  body.vertical .t { flex: 0 0 auto; max-width: none; margin: 2px 6px; padding-top: 4px; padding-bottom: 4px; }
  .t:nth-child(even) { color: var(--colors-tabs-even-fg); background: var(--colors-tabs-even-bg); }
  /* themes give inactive tabs the bar colour: tint them toward the selected tab so each pill shows */
  .t:not(.a) { background: color-mix(in srgb, var(--colors-tabs-selected-odd-bg) 35%, var(--colors-tabs-odd-bg)); }
  .t:not(.a):hover { background: color-mix(in srgb, var(--colors-tabs-selected-odd-bg) 70%, var(--colors-tabs-odd-bg)); }
  .t.a { font: var(--fonts-tabs-selected, 10pt monospace);
         color: var(--colors-tabs-selected-odd-fg); background: var(--colors-tabs-selected-odd-bg); }
  .t.a:nth-child(even) { color: var(--colors-tabs-selected-even-fg); background: var(--colors-tabs-selected-even-bg); }
  /* a crashed tab: a red ring inside the pill */
  .t.e { box-shadow: inset 0 0 0 2px var(--colors-tabs-indicator-error); }
  .t.z { opacity: .5; }
  .t img { flex: 0 0 auto; width: 1.2em; height: 1.2em; margin-right: .4em; }
  /* pinned tabs (not the focused one, which shows its title) are circles: icon only */
  body:not(.vertical) .t.n:not(.a) { flex: 0 0 auto; width: calc(100vh - 8px); min-width: 0;
                                    padding: 0; justify-content: center; }
  body:not(.vertical) .t.n:not(.a) span { flex: 0 1 auto; }
  body:not(.vertical) .t.n:not(.a) img + span { display: none; }
  body:not(.vertical) .t.n:not(.a) img { margin-right: 0; }
  /* Status (no status bar): mode, pending keys, message at the end; load progress as a line. */
  #tabs { display: contents; }
  /* Tabs overflow inside their own box, so many tabs can't push #info (prompts!) off the bar. */
  body:not(.vertical) #tabs { display: flex; flex: 1 1 0; min-width: 0; overflow: hidden;
                              gap: 4px; padding: 4px; box-sizing: border-box; }
  /* named profile, always first in the bar */
  #profile { flex: 0 0 auto; align-self: center; margin: 0 6px; padding: 1px 10px; border-radius: 999px;
             font: var(--fonts-tabs-selected, inherit); font-weight: bold;
             background: var(--colors-tabs-indicator-start, #48f); color: var(--colors-tabs-bar-bg, #000); }
  #profile:empty { display: none; }
  body.vertical #profile { align-self: stretch; margin: 6px 8px; text-align: center; }
  #info { margin-left: auto; display: flex; align-items: center; gap: 6px; padding: 0 8px; flex: 0 1 auto;
          min-width: 0; font: var(--fonts-statusbar, 10pt monospace); white-space: nowrap; }
  body.vertical #info { margin: auto 0 0; padding: 6px 8px; flex-wrap: wrap; white-space: normal;
                        position: sticky; bottom: 0; background: var(--colors-tabs-bar-bg, #555); }
  #info span:empty { display: none; }
  #info span { padding: 1px 9px; border-radius: 999px; overflow: hidden; text-overflow: ellipsis; }
  #mode { color: var(--colors-statusbar-normal-fg); background: var(--colors-statusbar-normal-bg); }
  #mode.insert { color: var(--colors-statusbar-insert-fg); background: var(--colors-statusbar-insert-bg); }
  #mode.passthrough { color: var(--colors-statusbar-passthrough-fg); background: var(--colors-statusbar-passthrough-bg); }
  #mode.command { color: var(--colors-statusbar-command-fg); background: var(--colors-statusbar-command-bg); }
  #keys { color: var(--colors-statusbar-normal-fg); background: var(--colors-statusbar-normal-bg); }
  #msg { min-width: 0; }
  #dl { color: var(--colors-statusbar-normal-fg); background: var(--colors-statusbar-normal-bg); cursor: pointer;
        font-variant-numeric: tabular-nums; }
  #dl.run { color: var(--colors-downloads-start-fg, inherit); background: var(--colors-downloads-start-bg, inherit); }
  #dl.done { color: var(--colors-downloads-stop-fg, inherit); background: var(--colors-downloads-stop-bg, inherit); }
  #dl.fail { color: var(--colors-downloads-error-fg, inherit); background: var(--colors-downloads-error-bg, inherit); }
  #msg.error { color: var(--colors-messages-error-fg); background: var(--colors-messages-error-bg); }
  #msg.warning { color: var(--colors-messages-warning-fg); background: var(--colors-messages-warning-bg); }
  #msg.prompt { color: var(--colors-prompts-fg); background: var(--colors-prompts-bg); border: var(--colors-prompts-border, none); }
  #msg.info { color: var(--colors-messages-info-fg); background: var(--colors-messages-info-bg); }
  #progress { position: fixed; left: 0; bottom: 0; height: 2px; width: 0; transition: width 120ms;
              background: var(--colors-statusbar-progress-bg); }
  body.vertical #progress { top: 0; bottom: auto; }
</style>
<body>
<div id="profile"></div><div id="tabs"></div><div id="info"><span id="msg"></span><span id="keys"></span><span id="dl" title="Downloads"></span><span id="mode"></span></div><div id="progress"></div>
<script>
  const $ = (id) => document.getElementById(id);
  nova.theme = (t) => {
    for (const [k, v] of Object.entries(t.vars)) document.documentElement.style.setProperty(k, v);
    document.body.classList.toggle("vertical", t.vertical);
  };
  // Core → UI: nova.apply({tabs: [{t: label, a: active, l: loading, p: progress, e: crashed}],
  //   status: {mode, modename, cmd, keys, level, msg, loading, p, crashed}}).
  let tipTimer, dragFrom = -1, first = true;
  // tab key (stable per tab, window.rs) -> its element: updated in place, so opening,
  // closing and moving can animate
  const els = new Map();
  const idx = (d) => Number(d.dataset.i);
  // drag a tab onto another to move it there (the press already focused it, so move the active tab)
  document.onmouseup = () => { dragFrom = -1; };
  nova.apply = (s) => {
    const st = s.status;
    $("profile").textContent = st.profile;
    $("mode").textContent = st.cmd ? "" : st.mode.replace(/^-- | --$/g, "");
    $("mode").className = st.modename;
    $("keys").textContent = st.keys;
    $("dl").textContent = st.dl;
    $("dl").className = st.dlc;
    // messages show as a toast (ui/toast.html), not in the bar
    $("progress").style.width = st.loading ? Math.max(3, Math.round(st.p * 100)) + "%" : "0";
    const box = $("tabs"), live = new Set();
    s.tabs.forEach((tab, i) => {
      live.add(tab.k);
      let d = els.get(tab.k);
      if (!d) {
        d = document.createElement("div");
        els.set(tab.k, d);
        if (!first) { d.classList.add("new"); d.addEventListener("animationend", () => d.classList.remove("new"), { once: true }); }
        d.onmousedown = (e) => {
          const i = idx(d);
          clearTimeout(tipTimer);
          if (e.button === 0) { dragFrom = i; nova.send("tab " + i); }
          if (e.button === 1) { e.preventDefault(); nova.send("close " + i); }
          if (e.button === 2) { const r = d.getBoundingClientRect(); nova.send(`menu ${i} ${Math.round(e.clientX)} ${Math.round(r.bottom)} ${Math.round(r.right)}`); }
        };
        d.onmouseup = (e) => { if (e.button === 0 && dragFrom >= 0 && dragFrom !== idx(d)) nova.send("move " + idx(d)); };
        d.oncontextmenu = (e) => e.preventDefault();
        // hover: full title + URL after a short wait
        d.onmouseenter = () => {
          clearTimeout(tipTimer);
          tipTimer = setTimeout(() => { const r = d.getBoundingClientRect(); nova.send(`tip ${idx(d)} ${Math.round(r.left)} ${Math.round(r.bottom)} ${Math.round(r.right)}`); }, 450);
        };
        d.onmouseleave = () => { clearTimeout(tipTimer); nova.send("tip -1"); };
      }
      d.dataset.i = i;
      const cls = "t" + (tab.a ? " a" : "") + (tab.e ? " e" : tab.l ? " l" : " d") + (tab.n ? " n" : "") + (tab.z ? " z" : "") + (d.classList.contains("new") ? " new" : "");
      if (d.className !== cls) d.className = cls;
      const sig = [tab.l, tab.i, tab.t].join("\n");
      if (d.dataset.sig !== sig) {
        d.dataset.sig = sig;
        const icon = tab.l ? Object.assign(document.createElement("i"), { className: "sp" })
          : tab.i ? Object.assign(document.createElement("img"), { src: tab.i }) : null;
        const label = document.createElement("span"); label.textContent = tab.t;
        d.replaceChildren(...(icon ? [icon] : []), label);
      }
      // keep DOM order = tab order (moves keep the element); closing ones stay where they were
      const want = [...box.children].filter((x) => !x.classList.contains("out"))[i];
      if (want !== d) box.insertBefore(d, want || null);
    });
    for (const [k, d] of els) {
      if (live.has(k)) continue;
      els.delete(k);
      d.classList.add("out");
      setTimeout(() => d.remove(), 200);
    }
    first = false;
    document.querySelector(".t.a")?.scrollIntoView({ block: "nearest", inline: "nearest" });
  };
  $("dl").onmousedown = (e) => { e.stopPropagation(); nova.send("run downloads"); };
  nova.send("ready");
</script>
</body>
